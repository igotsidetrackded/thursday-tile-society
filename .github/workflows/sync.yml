name: Sync Google Sheet Schedule

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

concurrency:
  group: sync-google-sheet-schedule
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --no-save --no-package-lock googleapis

      - name: Fetch Data from Google Sheet
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: node scripts/sync-schedule.js

      - name: Commit and Push Updated Schedule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --staged --quiet; then
            echo "No schedule changes to commit."
            exit 0
          fi
          git commit -m "Auto-update schedule from Google Sheets"
          git pull --rebase
          git push
